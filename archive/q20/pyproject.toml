[project]
name = "q20"
version = "1.0.0"
description = "q20: a '20 Questions' multi-agent league. A Judge agent picks a corpus paragraph and emits a hint + associative-word chain; a Player agent fires 20 multiple-choice questions in one batch, then guesses the opening sentence + the associative word. A deterministic referee scores; groups compete in a round-robin league. Local Ollama, no API key."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]
google = [
    "google-api-python-client>=2.197.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
# Non-ASCII (Hebrew) project path breaks editable installs on Windows; tests use pythonpath.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=q20 --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["src"]
omit = ["*/cli/*", "*/__main__.py", "*/mcp/*"]

[tool.coverage.report]
fail_under = 85

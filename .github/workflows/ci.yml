name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync dependencies
        run: uv sync --dev
      - name: Ruff
        run: uv run ruff check src tests
      - name: Pytest (+coverage gate 85%)
        run: uv run pytest
